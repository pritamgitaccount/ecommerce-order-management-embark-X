spring:
  application:
    name: ecom-application

#  h2:
#    console:
#      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/ecomdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect


